# Gerbang mutu EduSaaS (PRD §8: "CI wajib hijau sebelum merge").
# Satu-satunya perbedaan dari mesin lokal: PostgreSQL 18 dijalankan sebagai
# service container, sehingga migrasi RLS dan test isolasi tenant benar-benar
# dieksekusi di sini.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusaas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pasang dependency
        run: pnpm install --frozen-lockfile

      - name: Siapkan .env
        run: cp .env.example .env

      - name: Terapkan migrasi
        run: pnpm db:deploy

      - name: Isi data seed
        run: pnpm db:seed

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Unit dan integrasi (test isolasi tenant ikut jalan)
        run: pnpm test

      - run: pnpm build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusaas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pasang dependency
        run: pnpm install --frozen-lockfile

      - name: Siapkan .env
        run: cp .env.example .env

      - name: Terapkan migrasi
        run: pnpm db:deploy

      - run: pnpm db:generate

      - name: Pasang browser Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Jalankan E2E
        run: pnpm test:e2e